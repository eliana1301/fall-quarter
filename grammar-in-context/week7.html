ria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;sec&quot; id=&quot;s2&quot;&gt;&lt;h2&gt;&lt;span class=&quot;n&quot; aria-hidden=&quot;true&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;The Postman Who Built a Palace&lt;/span&gt; &lt;span class=&quot;tag&quot;&gt;READING&lt;/span&gt;&lt;/h2&gt;&lt;p class=&quot;inst&quot;&gt;Read the story. What did Ferdinand Cheval build, and how long did it take?&lt;/p&gt;&lt;details class=&quot;more readbox&quot; open&gt;&lt;summary&gt;Read: &lt;b&gt;The Postman Who Built a Palace&lt;/b&gt;&lt;/summary&gt;&lt;div class=&quot;more-body&quot;&gt;&lt;div class=&quot;reading&quot;&gt;&lt;p style=&quot;margin:0 0 10px&quot;&gt;Every day for more than thirty years, a hard-working French postman named Ferdinand Cheval walked the same eighteen-mile route through the quiet countryside near Hauterives. He delivered letters to farms and villages, and to pass the long hours, this absent-minded dreamer pictured grand castles and palaces in his head.&lt;/p&gt;&lt;p style=&quot;margin:0 0 10px&quot;&gt;One spring morning in 1879, when Cheval was already middle-aged, he tripped over a strange, oddly shaped stone. He picked it up, turned it over in his hands, and had a life-changing idea. What if he could build the palace he had imagined for so long, using stones he collected on his daily route?&lt;/p&gt;&lt;p style=&quot;margin:0 0 10px&quot;&gt;From that day on, the strong-willed postman filled his pockets with stones. Soon his pockets were not enough, so he carried a basket, and later he pushed a worn-out wheelbarrow for miles. He worked alone, mostly at night, by the light of an oil lamp. His neighbors were narrow-minded about the whole thing and said he had lost his mind.&lt;/p&gt;&lt;p style=&quot;margin:0 0 10px&quot;&gt;For thirty-three years, Cheval kept going. He was completely self-taught, and he had never studied architecture or design. Stone by stone, he shaped towers, staircases, and animals into a one-of-a-kind palace that he called the Ideal Palace. The work felt never-ending, but he refused to give up.&lt;/p&gt;&lt;p style=&quot;margin:0 0 10px&quot;&gt;He finally finished in 1912, at the age of seventy-six. Today his Ideal Palace is world-famous, and tourists travel from all over the world to see it. The strange dream of one patient postman turned out to be long-lasting after all, and the man his village once laughed at is now a well-known symbol of what quiet determination can build.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h3&gt;Talk About It&lt;/h3&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f5&quot;&gt;1. Why do you think Cheval kept building for thirty-three years, even when his neighbors laughed at him?&lt;/label&gt;&lt;textarea id=&quot;f5&quot; rows=&quot;2&quot; data-key=&quot;talk1&quot; data-label=&quot;1. Why do you think Cheval kept building for thirty-three years, even when his neighbors laughed at him?&quot; placeholder=&quot;&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f6&quot;&gt;2. The story says Cheval was self-taught. What is something you have taught yourself to do, without a class or a teacher?&lt;/label&gt;&lt;textarea id=&quot;f6&quot; rows=&quot;2&quot; data-key=&quot;talk2&quot; data-label=&quot;2. The story says Cheval was self-taught. What is something you have taught yourself to do, without a class or a teacher?&quot; placeholder=&quot;&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f7&quot;&gt;3. Is there a one-of-a-kind place you have visited, or one you would love to see? Describe it.&lt;/label&gt;&lt;textarea id=&quot;f7&quot; rows=&quot;2&quot; data-key=&quot;talk3&quot; data-label=&quot;3. Is there a one-of-a-kind place you have visited, or one you would love to see? Describe it.&quot; placeholder=&quot;&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;sec&quot; id=&quot;s3&quot;&gt;&lt;h2&gt;&lt;span class=&quot;n&quot; aria-hidden=&quot;true&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;Shrink It!&lt;/span&gt; &lt;span class=&quot;tag&quot;&gt;RACE&lt;/span&gt;&lt;/h2&gt;&lt;p class=&quot;inst&quot;&gt;Race with your partner. Find the compound adjective in the story and type the short version, with the adjective before the noun. Say it out loud first!&lt;/p&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f8&quot;&gt;1. a route that is eighteen miles long&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;f8&quot; data-key=&quot;shrink1&quot; data-label=&quot;1. a route that is eighteen miles long&quot; placeholder=&quot;Short version from the story&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f9&quot;&gt;2. a postman who works hard&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;f9&quot; data-key=&quot;shrink2&quot; data-label=&quot;2. a postman who works hard&quot; placeholder=&quot;Short version from the story&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f10&quot;&gt;3. a dreamer whose mind is often somewhere else&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;f10&quot; data-key=&quot;shrink3&quot; data-label=&quot;3. a dreamer whose mind is often somewhere else&quot; placeholder=&quot;Short version from the story&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f11&quot;&gt;4. an idea that changed his life&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;f11&quot; data-key=&quot;shrink4&quot; data-label=&quot;4. an idea that changed his life&quot; placeholder=&quot;Short version from the story&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f12&quot;&gt;5. a postman with a strong will&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;f12&quot; data-key=&quot;shrink5&quot; data-label=&quot;5. a postman with a strong will&quot; placeholder=&quot;Short version from the story&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f13&quot;&gt;6. a wheelbarrow that was used until it was old and damaged&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;f13&quot; data-key=&quot;shrink6&quot; data-label=&quot;6. a wheelbarrow that was used until it was old and damaged&quot; placeholder=&quot;Short version from the story&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f14&quot;&gt;7. neighbors who did not accept new ideas&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;f14&quot; data-key=&quot;shrink7&quot; data-label=&quot;7. neighbors who did not accept new ideas&quot; placeholder=&quot;Short version from the story&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f15&quot;&gt;8. a palace that is the only one of its kind&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;f15&quot; data-key=&quot;shrink8&quot; data-label=&quot;8. a palace that is the only one of its kind&quot; placeholder=&quot;Short version from the story&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f16&quot;&gt;9. work that never seemed to end&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;f16&quot; data-key=&quot;shrink9&quot; data-label=&quot;9. work that never seemed to end&quot; placeholder=&quot;Short version from the story&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f17&quot;&gt;10. a symbol that people know well&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;f17&quot; data-key=&quot;shrink10&quot; data-label=&quot;10. a symbol that people know well&quot; placeholder=&quot;Short version from the story&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;details class=&quot;more &quot;&gt;&lt;summary&gt;Answers (open after the race)&lt;/summary&gt;&lt;div class=&quot;more-body&quot;&gt;&lt;ol&gt;&lt;li&gt;an eighteen-mile route&lt;/li&gt;&lt;li&gt;a hard-working postman&lt;/li&gt;&lt;li&gt;an absent-minded dreamer&lt;/li&gt;&lt;li&gt;a life-changing idea&lt;/li&gt;&lt;li&gt;a strong-willed postman&lt;/li&gt;&lt;li&gt;a worn-out wheelbarrow&lt;/li&gt;&lt;li&gt;narrow-minded neighbors&lt;/li&gt;&lt;li&gt;a one-of-a-kind palace&lt;/li&gt;&lt;li&gt;never-ending work&lt;/li&gt;&lt;li&gt;a well-known symbol&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/details&gt;&lt;h3&gt;Notice&lt;/h3&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f18&quot;&gt;1. Look at &amp;quot;an eighteen-mile route&amp;quot;. Why is it mile, not miles?&lt;/label&gt;&lt;textarea id=&quot;f18&quot; rows=&quot;2&quot; data-key=&quot;notice1&quot; data-label=&quot;1. Look at &amp;amp;quot;an eighteen-mile route&amp;amp;quot;. Why is it mile, not miles?&quot; placeholder=&quot;&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f19&quot;&gt;2. Look at your answers. Does the compound adjective come before or after the noun?&lt;/label&gt;&lt;textarea id=&quot;f19&quot; rows=&quot;2&quot; data-key=&quot;notice2&quot; data-label=&quot;2. Look at your answers. Does the compound adjective come before or after the noun?&quot; placeholder=&quot;&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f20&quot;&gt;3. Find &amp;quot;oddly shaped&amp;quot; in paragraph 2. Is there a hyphen? Why not?&lt;/label&gt;&lt;textarea id=&quot;f20&quot; rows=&quot;2&quot; data-key=&quot;notice3&quot; data-label=&quot;3. Find &amp;amp;quot;oddly shaped&amp;amp;quot; in paragraph 2. Is there a hyphen? Why not?&quot; placeholder=&quot;&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card rulecard&quot;&gt;&lt;h3&gt;Write your rule&lt;/h3&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f21&quot;&gt;1. Before a noun, a compound adjective has a ________.&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;f21&quot; data-key=&quot;rule1&quot; data-label=&quot;1. Before a noun, a compound adjective has a ________.&quot; placeholder=&quot;&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f22&quot;&gt;2. With a number, the noun stays ________ (eighteen-mile, not eighteen-miles).&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;f22&quot; data-key=&quot;rule2&quot; data-label=&quot;2. With a number, the noun stays ________ (eighteen-mile, not eighteen-miles).&quot; placeholder=&quot;&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f23&quot;&gt;3. Adverbs that end in -ly ________ (oddly shaped, highly respected).&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;f23&quot; data-key=&quot;rule3&quot; data-label=&quot;3. Adverbs that end in -ly ________ (oddly shaped, highly respected).&quot; placeholder=&quot;&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;details class=&quot;more &quot;&gt;&lt;summary&gt;Model rule (open after the class check)&lt;/summary&gt;&lt;div class=&quot;more-body&quot;&gt;&lt;ol&gt;&lt;li&gt;hyphen (a hard-working postman). After be, feel, or seem, most keep it too (He was self-taught)&lt;/li&gt;&lt;li&gt;singular (a ten-minute walk, a five-year-old girl)&lt;/li&gt;&lt;li&gt;do not take a hyphen&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;sec&quot; id=&quot;s4&quot;&gt;&lt;h2&gt;&lt;span class=&quot;n&quot; aria-hidden=&quot;true&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;Practice&lt;/span&gt; &lt;span class=&quot;tag&quot;&gt;PAIRS&lt;/span&gt;&lt;/h2&gt;&lt;h3&gt;A. Make it shorter. Describe each noun with a compound adjective.&lt;/h3&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f24&quot;&gt;1. a child who behaves well&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;f24&quot; data-key=&quot;pa1&quot; data-label=&quot;1. a child who behaves well&quot; placeholder=&quot;a ...-... noun&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f25&quot;&gt;2. a dessert that makes your mouth water&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;f25&quot; data-key=&quot;pa2&quot; data-label=&quot;2. a dessert that makes your mouth water&quot; placeholder=&quot;a ...-... noun&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f26&quot;&gt;3. a phone that is brand new&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;f26&quot; data-key=&quot;pa3&quot; data-label=&quot;3. a phone that is brand new&quot; placeholder=&quot;a ...-... noun&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f27&quot;&gt;4. a film that makes you think (provokes thought)&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;f27&quot; data-key=&quot;pa4&quot; data-label=&quot;4. a film that makes you think (provokes thought)&quot; placeholder=&quot;a ...-... noun&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&l &lt;div class=&quot;top&quot;&gt;&lt;div&gt;&lt;div class=&quot;org&quot;&gt;APPROACH INTERNATIONAL STUDENT CENTER&lt;/div&gt;&lt;h1&gt;Compound Adjectives&lt;/h1&gt;&lt;p class=&quot;sub&quot;&gt;Week 7 Reference Card · The Postman Who Built a Palace&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h2 style=&quot;margin-top:0&quot;&gt;What is a compound adjective?&lt;/h2&gt;&lt;p style=&quot;margin:0&quot;&gt;Two or more words that work together as ONE adjective before a noun.&lt;/p&gt;
&lt;p class=&quot;ice&quot; style=&quot;margin:8px 0 0&quot;&gt;a &lt;b&gt;well-known&lt;/b&gt; postman = a postman who is known well &amp;nbsp;·&amp;nbsp; an &lt;b&gt;eighteen-mile&lt;/b&gt; route = a route that is eighteen miles long&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2 style=&quot;margin-top:0&quot;&gt;1. How they are formed&lt;/h2&gt;&lt;table class=&quot;st&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Pattern&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Examples&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td data-l=&quot;Pattern&quot;&gt;&lt;b class=&quot;navy&quot;&gt;number + noun (singular)&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;an eighteen-mile route, a five-year-old girl&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Pattern&quot;&gt;&lt;b class=&quot;navy&quot;&gt;adjective or adverb + -ing&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;a good-looking actor, a hard-working postman&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Pattern&quot;&gt;&lt;b class=&quot;navy&quot;&gt;noun + -ing&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;a life-changing idea, a mouth-watering dessert&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Pattern&quot;&gt;&lt;b class=&quot;navy&quot;&gt;noun + adjective&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;a world-famous palace, a sugar-free drink&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Pattern&quot;&gt;&lt;b class=&quot;navy&quot;&gt;well / self + past participle&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;a well-known symbol, a self-taught builder&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Pattern&quot;&gt;&lt;b class=&quot;navy&quot;&gt;adjective + noun + -ed&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;a strong-willed man, an absent-minded dreamer&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Pattern&quot;&gt;&lt;b class=&quot;navy&quot;&gt;short phrase&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;a one-of-a-kind palace, an up-to-date map&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2 style=&quot;margin-top:0&quot;&gt;2. The hyphen rules&lt;/h2&gt;&lt;table class=&quot;st&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Where?&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Rule and examples&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td data-l=&quot;Where?&quot;&gt;&lt;b class=&quot;navy&quot;&gt;Before a noun&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Rule and examples&quot;&gt;Use a hyphen: a well-known postman, a ten-minute walk.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Where?&quot;&gt;&lt;b class=&quot;navy&quot;&gt;After a verb (be, look, seem, feel)&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Rule and examples&quot;&gt;Most keep the hyphen: He was self-taught. The work felt never-ending.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Where?&quot;&gt;&lt;b class=&quot;navy&quot;&gt;Exception 1: well + past participle&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Rule and examples&quot;&gt;Usually no hyphen after the verb: The palace is well known.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Where?&quot;&gt;&lt;b class=&quot;navy&quot;&gt;Exception 2: ages and measurements&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Rule and examples&quot;&gt;Change the form: a nine-year-old girl, but She is nine years old.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Where?&quot;&gt;&lt;b class=&quot;navy&quot;&gt;Adverbs that end in -ly&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Rule and examples&quot;&gt;No hyphen: an oddly shaped stone, a highly respected doctor.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Where?&quot;&gt;&lt;b class=&quot;navy&quot;&gt;One word now&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Rule and examples&quot;&gt;homemade, handmade, worldwide, nationwide, outdated&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2 style=&quot;margin-top:0&quot;&gt;Numbers&lt;/h2&gt;&lt;p style=&quot;margin:0&quot;&gt;Singular before a noun:&lt;/p&gt;&lt;ul style=&quot;margin:4px 0 0;padding-left:20px&quot;&gt;&lt;li&gt;a ten-minute walk (NOT ten-minutes)&lt;/li&gt;&lt;li&gt;a five-year-old boy → The boy is five years old.&lt;/li&gt;&lt;li&gt;a two-week vacation → It is two weeks long.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2 style=&quot;margin-top:0&quot;&gt;Not sure?&lt;/h2&gt;&lt;ul style=&quot;margin:0;padding-left:20px&quot;&gt;&lt;li&gt;Before a noun: use the hyphen.&lt;/li&gt;&lt;li&gt;After a verb: keep it too, except well + past participle and age or measurement phrases.&lt;/li&gt;&lt;li&gt;Check a dictionary for one-word forms (homemade).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2 style=&quot;margin-top:0&quot;&gt;3. Useful compound adjectives&lt;/h2&gt;&lt;table class=&quot;st&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Topic&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Examples&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td data-l=&quot;Topic&quot;&gt;&lt;b class=&quot;navy&quot;&gt;Personality&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;laid-back, open-minded, kind-hearted, strong-willed, short-tempered, absent-minded, hard-working, self-confident&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Topic&quot;&gt;&lt;b class=&quot;navy&quot;&gt;Appearance&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;good-looking, blue-eyed, long-haired, well-dressed, middle-aged, left-handed&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Topic&quot;&gt;&lt;b class=&quot;navy&quot;&gt;Things and places&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;brand-new, secondhand (one word), world-famous, one-of-a-kind, user-friendly, eye-catching, long-lasting&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Topic&quot;&gt;&lt;b class=&quot;navy&quot;&gt;Food&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;mouth-watering, home-cooked, deep-fried, sugar-free, sun-dried&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Topic&quot;&gt;&lt;b class=&quot;navy&quot;&gt;Time and numbers&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;last-minute, time-consuming, part-time, full-time, ten-minute, five-year-old, three-day&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Topic&quot;&gt;&lt;b class=&quot;navy&quot;&gt;Work and money&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;well-paid, self-employed, tax-free, record-breaking, best-selling, thought-provoking&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2 style=&quot;margin-top:0&quot;&gt;4. Top mistakes&lt;/h2&gt;&lt;table class=&quot;st&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;✗ Don&#x27;t say&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;✓ Say&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td data-l=&quot;✗ Don&amp;#x27;t say&quot;&gt;&lt;span class=&quot;bad&quot;&gt;a five-years-old boy&lt;/span&gt;&lt;/td&gt;&lt;td data-l=&quot;✓ Say&quot;&gt;a five-year-old boy&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;✗ Don&amp;#x27;t say&quot;&gt;&lt;span class=&quot;bad&quot;&gt;a highly-respected teacher&lt;/span&gt;&lt;/td&gt;&lt;td data-l=&quot;✓ Say&quot;&gt;a highly respected teacher&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;✗ Don&amp;#x27;t say&quot;&gt;&lt;span class=&quot;bad&quot;&gt;He is a well known writer.&lt;/span&gt;&lt;/td&gt;&lt;td data-l=&quot;✓ Say&quot;&gt;He is a well-known writer.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;✗ Don&amp;#x27;t say&quot;&gt;&lt;span class=&quot;bad&quot;&gt;a twenty minutes walk&lt;/span&gt;&lt;/td&gt;&lt;td data-l=&quot;✓ Say&quot;&gt;a twenty-minute walk&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;✗ Don&amp;#x27;t say&quot;&gt;&lt;span class=&quot;bad&quot;&gt;She is ten-years-old.&lt;/span&gt;&lt;/td&gt;&lt;td data-l=&quot;✓ Say&quot;&gt;She is ten years old.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;✗ Don&amp;#x27;t say&quot;&gt;&lt;span class=&quot;bad&quot;&gt;a world wide brand&lt;/span&gt;&lt;/td&gt;&lt;td data-l=&quot;✓ Say&quot;&gt;a worldwide brand&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

<script>
(function(){

var tabs=[].slice.call(document.querySelectorAll('[role=tab]'));
var names=tabs.map(function(t){return t.dataset.tab;});
function show(name,focus){
 if(names.indexOf(name)<0)name=names[0];
 tabs.forEach(function(t){var on=t.dataset.tab===name;t.setAttribute('aria-selected',on?'true':'false');t.tabIndex=on?0:-1;
  var p=document.getElementById('panel-'+t.dataset.tab);p.hidden=!on;

 document.title=document.querySelector('#tab-'+name+' .lb').textContent+' · Week 7 · Grammar in Context';
}
tabs.forEach(function(t,i){
