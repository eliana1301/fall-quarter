  &lt;p class=&quot;sub&quot;&gt;Week 8 &amp;nbsp;|&amp;nbsp; In the End, It Worked Out &amp;nbsp;|&amp;nbsp; Prepositions at Work&lt;/p&gt;
  &lt;div class=&quot;idrow&quot;&gt;
    &lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f1&quot;&gt;Name&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;f1&quot; data-key=&quot;name&quot; data-label=&quot;Name&quot; placeholder=&quot;Your full name&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;/div&gt;
  &lt;div class=&quot;choice-wrap&quot;&gt;&lt;div id=&quot;g2&quot; class=&quot; qlabel&quot;&gt;I am working&lt;/div&gt;&lt;div class=&quot;choices sm&quot; role=&quot;group&quot; aria-labelledby=&quot;g2&quot; data-key=&quot;where&quot; data-label=&quot;I am working&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;room&quot; aria-pressed=&quot;false&quot;&gt;In the room&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;online&quot; aria-pressed=&quot;false&quot;&gt;Online&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;span class=&quot;mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/header&gt;&lt;section class=&quot;sec&quot; id=&quot;s1&quot;&gt;&lt;h2&gt;&lt;span class=&quot;n&quot; aria-hidden=&quot;true&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;Tell Me About...&lt;/span&gt; &lt;span class=&quot;tag&quot;&gt;PAIRS&lt;/span&gt;&lt;/h2&gt;&lt;p class=&quot;inst&quot;&gt;Ask your partner. Then switch. Ask one follow-up question each time. Just talk!&lt;/p&gt;&lt;ol class=&quot;wu&quot;&gt;&lt;li&gt;What do you usually do &lt;b class=&quot;verb&quot;&gt;on&lt;/b&gt; Sunday mornings?&lt;/li&gt;&lt;li&gt;Where were you &lt;b class=&quot;verb&quot;&gt;at&lt;/b&gt; this time yesterday?&lt;/li&gt;&lt;li&gt;What are you really good &lt;b class=&quot;verb&quot;&gt;at&lt;/b&gt;? How did you learn it?&lt;/li&gt;&lt;li&gt;What is something you are worried &lt;b class=&quot;verb&quot;&gt;about&lt;/b&gt; right now?&lt;/li&gt;&lt;li&gt;Who do you rely &lt;b class=&quot;verb&quot;&gt;on&lt;/b&gt; when you have a problem?&lt;/li&gt;&lt;li&gt;What do you look forward &lt;b class=&quot;verb&quot;&gt;to&lt;/b&gt; at the end of the week?&lt;/li&gt;&lt;/ol&gt;&lt;p class=&quot;muted&quot;&gt;&lt;b&gt;Notice:&lt;/b&gt; Look at the words in bold. Could you use a different preposition? (good IN? worried FOR?) Why not?&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;sec&quot; id=&quot;s2&quot;&gt;&lt;h2&gt;&lt;span class=&quot;n&quot; aria-hidden=&quot;true&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;In the End, It Worked Out&lt;/span&gt; &lt;span class=&quot;tag&quot;&gt;READING&lt;/span&gt;&lt;/h2&gt;&lt;p class=&quot;inst&quot;&gt;Read the story. Why was Daniela nervous? How did the day end?&lt;/p&gt;&lt;details class=&quot;more readbox&quot; open&gt;&lt;summary&gt;Read: &lt;b&gt;In the End, It Worked Out&lt;/b&gt;&lt;/summary&gt;&lt;div class=&quot;more-body&quot;&gt;&lt;div class=&quot;reading&quot;&gt;&lt;p style=&quot;margin:0 0 10px&quot;&gt;On a rainy Monday in March, Daniela had a job interview at 9:00 at a small design company downtown. She had applied for the position two weeks earlier, and she was nervous about it. She left home at 8:15 to be on time, but her bus got stuck in traffic for twenty minutes. She ran the last three blocks and arrived just in time, at 8:59.&lt;/p&gt;&lt;p style=&quot;margin:0 0 10px&quot;&gt;The office was on the fifth floor. A manager named Mr. Okafor, who is in charge of the design team, met her at the door. &amp;quot;We received more than eighty applications,&amp;quot; he said. &amp;quot;Among them, we chose six people to interview, and you are one of them.&amp;quot;&lt;/p&gt;&lt;p style=&quot;margin:0 0 10px&quot;&gt;During the interview, he asked about her experience. Daniela explained that at her last job she was responsible for social media and worked closely with the sales team. &amp;quot;I&amp;#x27;m interested in this job because I want to learn more about packaging design,&amp;quot; she said. &amp;quot;And I&amp;#x27;m good at working under pressure.&amp;quot; He laughed. &amp;quot;We noticed!&amp;quot;&lt;/p&gt;&lt;p style=&quot;margin:0 0 10px&quot;&gt;At the end of the interview, Mr. Okafor said they would choose between the final two candidates by Friday. Daniela waited until Thursday afternoon, checking her phone every ten minutes. Then an email arrived: &amp;quot;On behalf of the whole team, I am happy to offer you the position.&amp;quot; In the end, that rainy Monday turned out to be one of the best days of her life.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h3&gt;Talk About It (with your partner)&lt;/h3&gt;&lt;ol class=&quot;wu&quot;&gt;&lt;li&gt;Have you ever been late for something important? What happened?&lt;/li&gt;&lt;li&gt;What are you good at that would help you in a job interview?&lt;/li&gt;&lt;li&gt;Daniela waited three days for an answer. How do you deal with waiting?&lt;/li&gt;&lt;/ol&gt;&lt;/section&gt;&lt;section class=&quot;sec&quot; id=&quot;s3&quot;&gt;&lt;h2&gt;&lt;span class=&quot;n&quot; aria-hidden=&quot;true&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;Notice&lt;/span&gt; &lt;span class=&quot;tag&quot;&gt;DISCOVER&lt;/span&gt;&lt;/h2&gt;&lt;p class=&quot;inst&quot;&gt;Find each phrase in the story. What kind is it? Tap, then check.&lt;/p&gt;&lt;div id=&quot;grp-nt&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;qlabel&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt; &lt;b&gt;at 9:00&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;choice-wrap&quot;&gt;&lt;div id=&quot;g3&quot; class=&quot;sr qlabel&quot;&gt;at 9:00: what kind?&lt;/div&gt;&lt;div class=&quot;choices sm&quot; role=&quot;group&quot; aria-labelledby=&quot;g3&quot; data-key=&quot;nt1&quot; data-label=&quot;at 9:00: what kind?&quot; data-answer=&quot;time&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;time&quot; aria-pressed=&quot;false&quot;&gt;time&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;place&quot; aria-pressed=&quot;false&quot;&gt;place&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;purpose&quot; aria-pressed=&quot;false&quot;&gt;purpose&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;adjective + preposition&quot; aria-pressed=&quot;false&quot;&gt;adjective + preposition&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;verb + preposition&quot; aria-pressed=&quot;false&quot;&gt;verb + preposition&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;fixed phrase&quot; aria-pressed=&quot;false&quot;&gt;fixed phrase&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;span class=&quot;mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;qlabel&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt; &lt;b&gt;on the fifth floor&lt;/b& ressed=&quot;false&quot;&gt;fixed phrase&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;span class=&quot;mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;qlabel&quot;&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt; &lt;b&gt;on behalf of&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;choice-wrap&quot;&gt;&lt;div id=&quot;g8&quot; class=&quot;sr qlabel&quot;&gt;on behalf of: what kind?&lt;/div&gt;&lt;div class=&quot;choices sm&quot; role=&quot;group&quot; aria-labelledby=&quot;g8&quot; data-key=&quot;nt6&quot; data-label=&quot;on behalf of: what kind?&quot; data-answer=&quot;fixed phrase&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;time&quot; aria-pressed=&quot;false&quot;&gt;time&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;place&quot; aria-pressed=&quot;false&quot;&gt;place&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;purpose&quot; aria-pressed=&quot;false&quot;&gt;purpose&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;adjective + preposition&quot; aria-pressed=&quot;false&quot;&gt;adjective + preposition&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;verb + preposition&quot; aria-pressed=&quot;false&quot;&gt;verb + preposition&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;fixed phrase&quot; aria-pressed=&quot;false&quot;&gt;fixed phrase&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;span class=&quot;mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;qlabel&quot;&gt;&lt;span class=&quot;num&quot;&gt;7&lt;/span&gt; &lt;b&gt;by Friday&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;choice-wrap&quot;&gt;&lt;div id=&quot;g9&quot; class=&quot;sr qlabel&quot;&gt;by Friday: what kind?&lt;/div&gt;&lt;div class=&quot;choices sm&quot; role=&quot;group&quot; aria-labelledby=&quot;g9&quot; data-key=&quot;nt7&quot; data-label=&quot;by Friday: what kind?&quot; data-answer=&quot;time&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;time&quot; aria-pressed=&quot;false&quot;&gt;time&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;place&quot; aria-pressed=&quot;false&quot;&gt;place&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;purpose&quot; aria-pressed=&quot;false&quot;&gt;purpose&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;adjective + preposition&quot; aria-pressed=&quot;false&quot;&gt;adjective + preposition&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;verb + preposition&quot; aria-pressed=&quot;false&quot;&gt;verb + preposition&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;fixed phrase&quot; aria-pressed=&quot;false&quot;&gt;fixed phrase&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;span class=&quot;mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;qlabel&quot;&gt;&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt; &lt;b&gt;at the door&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;choice-wrap&quot;&gt;&lt;div id=&quot;g10&quot; class=&quot;sr qlabel&quot;&gt;at the door: what kind?&lt;/div&gt;&lt;div class=&quot;choices sm&quot; role=&quot;group&quot; aria-labelledby=&quot;g10&quot; data-key=&quot;nt8&quot; data-label=&quot;at the door: what kind?&quot; data-answer=&quot;place&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;time&quot; aria-pressed=&quot;false&quot;&gt;time&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;place&quot; aria-pressed=&quot;false&quot;&gt;place&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;purpose&quot; aria-pressed=&quot;false&quot;&gt;purpose&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;adjective + preposition&quot; aria-pressed=&quot;false&quot;&gt;adjective + preposition&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;verb + preposition&quot; aria-pressed=&quot;false&quot;&gt;verb + preposition&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;fixed phrase&quot; aria-pressed=&quot;false&quot;&gt;fixed phrase&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;span class=&quot;mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;checkrow no-print&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn check&quot; data-check=&quot;nt&quot;&gt;Check my answers&lt;/button&gt;&lt;div class=&quot;feedback&quot; id=&quot;fb-nt&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;sec&quot; id=&quot;s4&quot;&gt;&lt;h2&gt;&lt;span class=&quot;n&quot; aria-hidden=&quot;true&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;Same Word, Different Meaning&lt;/span&gt; &lt;span class=&quot;tag&quot;&gt;PAIRS&lt;/span&gt;&lt;/h2&gt;&lt;p class=&quot;inst&quot;&gt;Read each pair. Explain the difference to your partner in your own words. Just talk! Then open the answer.&lt;/p&gt;&lt;div class=&quot;card&quot;&gt;&lt;p style=&quot;margin:0 0 4px&quot;&gt;&lt;b class=&quot;navy&quot;&gt;1.&lt;/b&gt; &lt;b&gt;A&lt;/b&gt; The train left on time. &amp;nbsp; &lt;b&gt;B&lt;/b&gt; We got to the station in time to catch it.&lt;/p&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:0 0 6px&quot;&gt;&lt;i&gt;Which one means &amp;quot;at the planned time&amp;quot;? Which one means &amp;quot;not too late&amp;quot;?&lt;/i&gt;&lt;/p&gt;&lt;details class=&quot;more &quot;&gt;&lt;summary&gt;Answer&lt;/summary&gt;&lt;div class=&quot;more-body&quot;&gt;&lt;p&gt;On time = at the planned time (not late, not early). In time = early enough (before it was too late).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;p style=&quot;margin:0 0 4px&quot;&gt;&lt;b class=&quot;navy&quot;&gt;2.&lt;/b&gt; &lt;b&gt;A&lt;/b&gt; At the end of the interview, he shook her hand. &amp;nbsp; &lt;b&gt;B&lt;/b&gt; In the end, she got the job.&lt;/p&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:0 0 6px&quot;&gt;&lt;i&gt;Which one is a point in time? Which one means &amp;quot;finally, after everything&amp;quot;?&lt;/i&gt;&lt;/p&gt;&lt;details class=&quot;more &quot;&gt;&lt;summary&gt;Answer&lt;/summary&gt;&lt;div class=&quot;more-body&quot;&gt;&lt;p&gt;At the end (of something) = the last part of it. In the end = finally, after a long time or many problems.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;p style=&quot;margin:0 0 4px&quot;&gt;&lt;b class=&quot;navy&quot;&gt;3.&lt;/b&gt; &lt;b&gt;A&lt;/b&gt; Send the report by Friday. &amp;nbsp; &lt;b&gt;B&lt;/b&gt; I&amp;#x27;ll be at the office until Friday.&lt;/p&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:0 0 6px&quot;&gt;&lt;i&gt;Which one is a deadline? Which one continues up to that time?&lt;/i&gt;&lt;/p&gt;&lt;details class=&quot;more &quot;&gt;&lt;summary&gt;Answer&lt;/summary&gt;&lt;div class=&quot;more-body&quot;&gt;&lt;p&gt;By Friday = no later than Friday (a deadline). Until Friday = all the time up to Friday, then it stops.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;p style=&quot;margin:0 0 4px&quot;&gt;&lt;b class=&quot;navy&quot;&gt;4.&lt;/b&gt; &lt;b&gt;A&lt;/b&gt; She sat between Ana and Luis. &amp;nbsp; &lt;b&gt;B&lt;/b&gt; She was the only woman among the guests.&lt;/p&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:0 0 6px&quot;&gt;&lt;i&gt;Which one talks about separate people? Which one talks about a group?&lt;/i&gt;&lt;/p&gt;&lt;details class=&quot;more &quot;&gt;&lt;summary&gt;Answer&lt;/summary&gt;&lt;div class=&quot;more-body&quot;&gt;&lt;p&gt;Between = separate, clear people or things (even more than two). Among = inside a group seen as a whole.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;p style=&quot;margin:0 0 4px&quot;&gt;&lt;b class=&quot;navy&quot;&gt;5.&lt;/b&gt; &lt;b&gt;A&lt;/b&gt; I worked there for three years. &amp;nbsp; &lt;b&gt;B&lt;/b&gt; I worked there during the summer.&lt;/p&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:0 0 6px&quot;&gt;&lt;i&gt;Which one says how long? Which one says when?&lt;/i&gt;&lt;/p&gt;&lt;details class=&quot;more &quot;&gt;&lt;summary&gt;Answer&lt;/summary&gt;&lt;div class=&quot;more-body&quot;&gt;&lt;p&gt;For + a length of time (how long). During + a period or event (when).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;sec&quot; id=&quot;s5&quot;&gt;&lt;h2&gt;&lt;span class=&quot;n&quot; aria-hidden=&quot;true&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;Thirty Seconds!&lt;/span&gt; &lt;span class=&quot;tag&quot;&gt;PAIRS&lt;/span&gt;&lt;/h2&gt;&lt;p class=&quot;inst&quot;&gt;Talk for 30 seconds about a topic. Your partner asks one follow-up question. Online pairs: open the &lt;b&gt;Thirty Seconds!&lt;/b&gt; tab on your own device.&lt;/p&gt;&lt;div class=&quot;card&quot;&gt;&lt;b class=&quot;navy&quot;&gt;How to play&lt;/b&gt;&lt;ol class=&quot;wu&quot;&gt;&lt;li&gt;Pairs or groups of 3. Put the cards face down.&lt;/li&gt;&lt;li&gt;Take a card. Talk for 30 seconds about the topic. Use the preposition on the card!&lt;/li&gt;&lt;li&gt;Your partner listens, then asks one follow-up question.&lt;/li&gt;&lt;li&gt;Switch. Challenge: use one more preposition from today in every answer.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;sec&quot; id=&quot;s6&quot;&gt;&lt;h2&gt;&lt;span class=&quot;n&quot; aria-hidden=&quot;true&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;The Job Interview&lt;/span&gt; &lt;span class=&quot;tag&quot;&gt;ROLE-PLAY&lt;/span&gt;&lt;/h2&gt;&lt;p class=&quot;inst&quot;&gt;Pairs. Student A is the interviewer. Student B chooses a job and is the candidate. A asks at least 6 questions. B answers in full sentences and uses the preposition (I&amp;#x27;m responsible for...). A gives feedback: one great sentence and one preposition to fix. Switch roles and choose a new job. Then find a new partner.&lt;/p&gt;&lt;p&gt;&lt;b class=&quot;navy&quot;&gt;Jobs:&lt;/b&gt; barista · hotel receptionist · social media manager · tour guide · bank teller · teaching assistant · graphic designer · flight attendant&lt;/p&gt;&lt;div class=&quot;card&quot;&gt;&lt;b class=&quot;navy&quot;&gt;Interviewer questions&lt;/b&gt;&lt;ol class=&quot;wu&quot;&gt;&lt;li&gt;Tell me about your current job or studies. What are you responsible for?&lt;/li&gt;&lt;li&gt;Why are you interested in this position?&lt;/li&gt;&lt;li&gt;What are you good at? What are you not so good at?&lt;/li&gt;&lt;li&gt;Tell me about a time you were in charge of a project or a group.&lt;/li&gt;&lt;li&gt;How do you deal with stress or pressure?&lt;/li&gt;&lt;li&gt;Who do you usually rely on when you have a problem?&lt;/li&gt;&lt;li&gt;What are you most proud of?&lt;/li&gt;&lt;li&gt;Are you familiar with any tools or software that are useful for this job?&lt;/li&gt;&lt;li&gt;Why should we choose you over the other candidates?&lt;/li&gt;&lt;li&gt;Do you have any questions for us?&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;sec graded&quot; id=&quot;s7&quot;&gt;&lt;h2&gt;&lt;span class=&quot;n&quot; aria-hidden=&quot;true&quot;&gt;7&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;Prepositions Check&lt;/span&gt; &lt;span class=&quot;tag&quot;&gt;GRADED&lt;/span&gt;&lt;/h2&gt;&lt;div class=&quot;gradebar&quot;&gt;&lt;b&gt;GRADED TASK · 20 POINTS · WORK WITH A PARTNER&lt;/b&gt;&lt;span&gt;Write one answer for both of you. No phones or notes. Online pairs: one person types, then press Download and send the file to your teacher.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f11&quot;&gt;Partner 1 name&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;f11&quot; data-key=&quot;p1&quot; data-label=&quot;Partner 1 name&quot; placeholder=&quot;Full name&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f12&quot;&gt;Partner 2 name&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;f12&quot; data-key=&quot;p2&quot; data-label=&quot;Partner 2 name&quot; placeholder=&quot;Full name&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3&gt;Part 1. Choose the correct preposition (10 points)&lt;/h3&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;qlabel&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt; The meeting starts ___ 9:30.&lt;/div&gt;&lt;div class=&quot;choice-wrap&quot;&gt;&lt;div id=&quot;g13&quot; class=&quot;sr qlabel&quot;&gt;Part 1, 1: The meeting starts ___ 9:30.&lt;/div&gt;&lt;div class=&quot;choices sm&quot; role=&quot;group&quot; aria-labelledby=&quot;g13&quot; data-key=&quot;gch1&quot; data-label=&quot;Part 1, 1: The meeting starts ___ 9:30.&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;at&quot; aria-pressed=&quot;false&quot;&gt;at&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;on&quot; aria-pressed=&quot;false&quot;&gt;on&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;in&quot; aria-pressed=&quot;false&quot;&gt;in&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;span class=&quot;mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;qlabel&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt; My birthday is ___ July.&lt;/div&gt;&lt;div class=&quot;choice-wrap&quot;&gt;&lt;div id=&quot;g14&quot; class=&quot;sr qlabel&quot;&gt;Part 1, 2: My birthday is ___ July.&lt;/div&gt;&lt;div class=&quot;choices sm&quot; role=&quot;group&quot; aria-labelledby=&quot;g14&quot; data-key=&quot;gch2&quot; data-label=&quot;Part 1, 2: My birthday is ___ July.&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;at&quot; aria-pressed=&quot;false&quot;&gt;at&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;on&quot; aria-pressed=&quot;false&quot;&gt;on&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;in&quot; aria-pressed=&quot;false&quot;&gt;in&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;span class=&quot;mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;qlabel&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt; I&amp;#x27;ll call you ___ Friday morning.&lt;/div&gt;&lt;div class=&quot;choice-wrap&quot;&gt;&lt;div id=&quot;g15&quot; class=&quot;sr qlabel&quot;&gt;Part 1, 3: I&#x27;ll call you ___ Friday morning.&lt;/div&gt;&lt;div class=&quot;choices sm&quot; role=&quot;group&quot; aria-labelledby=&quot;g15&quot; data-key=&quot;gch3&quot; data-label=&quot;Part 1, 3: I&amp;#x27;ll call you ___ Friday morning.&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;at&quot; aria-pressed=&quot;false&quot;&gt;at&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;on&quot; aria-pressed=&quot;false&quot;&gt;on&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;in&quot; aria-pressed=&quot;false&quot;&gt;in&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;span class=&quot;mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;qlabel&quot;&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt; Please send the report ___ Thursday. It cannot be later.&lt;/div&gt;&lt;div class=&quot;choice-wrap&quot;&gt;&lt;div id=&quot;g16&quot; class=&quot;sr qlabel&quot;&gt;Part 1, 4: Please send the report ___ Thursday. It cannot be later.&lt;/div&gt;&lt;div class=&quot;choices sm&quot; role=&quot;group&quot; aria-labelledby=&quot;g16&quot; data-key=&quot;gch4&quot; data-label=&quot;Part 1, 4: Please send the report ___ Thursday. It cannot be later.&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;by&quot; aria-pressed=&quot;false&quot;&gt;by&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;until&quot; aria-pressed=&quot;false&quot;&gt;until&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;since&quot; aria-pressed=&quot;false&quot;&gt;since&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;span class=&quot;mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;qlabel&quot;&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt; I&amp;#x27;ll wait ___ 6:00, but then I have to leave.&lt;/div&gt;&lt;div class=&quot;choice-wrap&quot;&gt;&lt;div id=&quot;g17&quot; class=&quot;sr qlabel&quot;&gt;Part 1, 5: I&#x27;ll wait ___ 6:00, but then I have to leave.&lt;/div&gt;&lt;div class=&quot;choices sm&quot; role=&quot;group&quot; aria-labelledby=&quot;g17&quot; data-key=&quot;gch5&quot; data-label=&quot;Part 1, 5: I&amp;#x27;ll wait ___ 6:00, but then I have to leave.&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;by&quot; aria-pressed=&quot;false&quot;&gt;by&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;until&quot; aria-pressed=&quot;false&quot;&gt;until&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;during&quot; aria-pressed=&quot;false&quot;&gt;during&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;span class=&quot;mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;qlabel&quot;&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt; She fell asleep ___ the movie.&lt;/div&gt;&lt;div class=&quot;choice-wrap&quot;&gt;&lt;div id=&quot;g18&quot; class=&quot;sr qlabel&quot;&gt;Part 1, 6: She fell asleep ___ the movie.&lt;/div&gt;&lt;div class=&quot;choices sm&quot; role=&quot;group&quot; aria-labelledby=&quot;g18&quot; data-key=&quot;gch6&quot; data-label=&quot;Part 1, 6: She fell asleep ___ the movie.&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;for&quot; aria-pressed=&quot;false&quot;&gt;for&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;during&quot; aria-pressed=&quot;false&quot;&gt;during&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;while&quot; aria-pressed=&quot;false&quot;&gt;while&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt; &lt;div class=&quot;card&quot;&gt;&lt;h2 style=&quot;margin-top:0&quot;&gt;1. Time, place, and purpose&lt;/h2&gt;&lt;table class=&quot;st&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Rule&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;How it works&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Examples&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td data-l=&quot;Rule&quot;&gt;&lt;b class=&quot;navy&quot;&gt;Time: at, on, in&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;How it works&quot;&gt;at + clock times and night · on + days and dates (also on Friday morning) · in + months, years, seasons, parts of the day&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;&lt;i&gt;at 9:00 · at night · on Monday · on Friday morning · in March · in 2026 · in the morning&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Rule&quot;&gt;&lt;b class=&quot;navy&quot;&gt;Place: at, on, in&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;How it works&quot;&gt;at + a point · on + a surface or floor · in + inside a space&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;&lt;i&gt;at the door · on the fifth floor · in the office&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Rule&quot;&gt;&lt;b class=&quot;navy&quot;&gt;Purpose: to or for&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;How it works&quot;&gt;to + verb · for + noun or -ing (what a thing is used for)&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;&lt;i&gt;She left early to be on time. · a tool for cutting paper · She went out for coffee.&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Rule&quot;&gt;&lt;b class=&quot;navy&quot;&gt;By, until&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;How it works&quot;&gt;by = no later than (a deadline) · until = all the time up to then&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;&lt;i&gt;Finish it by Friday. · Wait until Friday.&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Rule&quot;&gt;&lt;b class=&quot;navy&quot;&gt;For, since, during&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;How it works&quot;&gt;for + how long · since + starting point · during + noun (when) · while + subject + verb&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;&lt;i&gt;for three years · since 2023 · during the meeting · while I was watching&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Rule&quot;&gt;&lt;b class=&quot;navy&quot;&gt;On time, in time&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;How it works&quot;&gt;on time = at the planned time · in time = early enough&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;&lt;i&gt;The train left on time. · We arrived in time to see the start.&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Rule&quot;&gt;&lt;b class=&quot;navy&quot;&gt;At the end, in the end&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;How it works&quot;&gt;at the end of = the last part · in the end = finally&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;&lt;i&gt;at the end of the day · In the end, she got the job.&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Rule&quot;&gt;&lt;b class=&quot;navy&quot;&gt;Between, among&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;How it works&quot;&gt;between = separate, clear people or things (2 or more) · among = in a group&lt;/td&gt;&lt;td data-l=&quot;Examples&quot;&gt;&lt;i&gt;the border between Spain and France · a deal between three companies · popular among teenagers&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
