<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fall Talk · Speaking Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#2B1A12;--bg2:#3D2418;--card:#FBF4E6;--ink:#2A1A10;--rust:#A2401C;--amber:#D98C1F;--mustard:#E4B43C;--wine:#6E1F2A;--olive:#5E6B2E;--muted:#6B5546}
*{box-sizing:border-box}
html,body{height:100%;overflow-x:hidden}
body{margin:0;background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 70%);color:var(--card);font-family:'Nunito Sans',system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column}
.leaves{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.leaf{position:absolute;top:-60px;opacity:.85;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-60px) rotate(0)}50%{transform:translate(40px,50vh) rotate(180deg)}100%{transform:translate(-20px,110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.leaf{animation:none;display:none}}
header{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;gap:12px}
.brand{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:22px;color:var(--mustard);letter-spacing:.5px}
.count{font-weight:700;font-size:18px;color:#F2DDBF}
main{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;padding:8px 20px}
.stage{width:min(1100px,100%);aspect-ratio:16/9;max-height:calc(100vh - 170px);position:relative}
.card{position:absolute;inset:0;background:var(--card);color:var(--ink);border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:center;padding:6% 8%;overflow:hidden;opacity:0;transform:translateX(40px) rotate(1deg);transition:opacity .35s ease,transform .35s ease;visibility:hidden}
.card.on{opacity:1;transform:none;visibility:visible}
.card.off-left{transform:translateX(-40px) rotate(-1deg)}
.card::before{content:"";position:absolute;inset:14px;border:2px dashed rgba(162,64,28,.28);border-radius:20px;pointer-events:none}
.num{position:absolute;top:6%;left:8%;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:clamp(20px,2.6vw,30px);color:var(--rust)}
.topic{position:absolute;top:6%;right:8%;font-weight:700;font-size:clamp(14px,1.5vw,18px);letter-spacing:2px;text-transform:uppercase;color:#fff;padding:6px 14px;border-radius:999px}
.q{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(28px,4.6vw,60px);line-height:1.18;margin:0;max-width:92%}
.corner{position:absolute;width:clamp(90px,14vw,170px);bottom:-18px;right:-14px;transform:rotate(-18deg);opacity:.95}
.corner2{position:absolute;width:clamp(60px,8vw,100px);bottom:16px;right:clamp(90px,13vw,160px);transform:rotate(24deg);opacity:.9}
nav{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:16px;padding:14px 20px 22px}
.btn{font:inherit;font-weight:700;font-size:18px;min-width:56px;min-height:52px;padding:10px 22px;border-radius:999px;border:2px solid var(--mustard);background:transparent;color:var(--card);cursor:pointer}
.btn:hover{background:rgba(228,180,60,.15)}
.btn:focus-visible,.dot:focus-visible{outline:3px solid #fff;outline-offset:3px}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--mustard);background:transparent;padding:0;cursor:pointer}
.dot[aria-current=true]{background:var(--mustard)}
@media (max-width:640px){.stage{aspect-ratio:auto;height:calc(100vh - 190px)}.card{padding:18% 7% 10%}.num{top:5%}.topic{top:5%}.btn{padding:10px 16px}.dots{display:none}.q{font-size:31px}}
</style>
</head>
<body>
<div class="leaves" aria-hidden="true" id="leaves"></div>
<header><div class="brand">Fall Talk</div><div class="count" id="count" aria-live="polite">1 / 10</div></header>
<main><div class="stage" id="stage" aria-roledescription="carousel"></div></main>
<nav aria-label="Card navigation">
<button class="btn" id="prev" aria-label="Previous card">←</button>
<div class="dots" id="dots"></div>
<button class="btn" id="next" aria-label="Next card">→</button>
</nav>
<script>
var CARDS=[
 ["Life in the U.S.","How long have you lived in the United States?"],
 ["Life in the U.S.","Why did you decide to study English in the U.S.?"],
 ["Work","Have you ever had a job interview in English?"],
 ["Work","What was your first job, and what did you do there?"],
 ["Life in the U.S.","Which places in Massachusetts have you visited so far?"],
 ["Everyday life","When did you last go to a doctor or a dentist here? How was it?"],
 ["Everyday life","What have you done this week to practice English outside class?"],
 ["Work & study","What did you study in school or at university?"],
 ["Your life","How many times have you moved in your life?"],
 ["Life in the U.S.","What was the best advice someone gave you when you arrived?"]
];
var TAGC={"Life in the U.S.":"#A2401C","Work":"#6E1F2A","Everyday life":"#5E6B2E","Work & study":"#8A5A14","Your life":"#7A3B12"};
var LEAF='<svg viewBox="0 0 100 100"><path fill="FILL" d="M50 4l9 20 16-9-4 21 22-2-14 16 15 10-23 5 5 21-20-12-6 22-6-22-20 12 5-21-23-5 15-10L7 34l22 2-4-21 16 9z"/><path d="M50 96V40" stroke="rgba(60,25,10,.55)" stroke-width="3" fill="none"/></svg>';
var OVAL='<svg viewBox="0 0 100 100"><path fill="FILL" d="M50 6C78 22 86 52 66 80 58 90 50 94 50 94S42 90 34 80C14 52 22 22 50 6z"/><path d="M50 94V20" stroke="rgba(60,25,10,.5)" stroke-width="3" fill="none"/></svg>';
var COLS=["#C2471C","#D98C1F","#E4B43C","#8E2A1E","#A65B1A"];
var stage=document.getElementById('stage'),dots=document.getElementById('dots'),count=document.getElementById('count');
CARDS.forEach(function(c,i){
 var d=document.createElement('section');d.className='card';d.setAttribute('role','group');d.setAttribute('aria-roledescription','card');d.setAttribute('aria-label',(i+1)+' of '+CARDS.length);
 d.innerHTML='<div class="num">'+String(i+1).padStart(2,'0')+'</div><div class="topic" style="background:'+TAGC[c[0]]+'">'+c[0]+'</div><p class="q">'+c[1]+'</p>'+
  '<div class="corner" aria-hidden="true">'+LEAF.replace('FILL',COLS[i%5])+'</div><div class="corner2" aria-hidden="true">'+OVAL.replace('FILL',COLS[(i+2)%5])+'</div>';
 stage.appendChild(d);
 var b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','Go to card '+(i+1));b.onclick=function(){go(i)};dots.appendChild(b);
});
var cards=stage.children,cur=0;
function go(n){n=(n+cards.length)%cards.length;for(var i=0;i<cards.length;i++){cards[i].classList.toggle('on',i===n);cards[i].classList.toggle('off-left',i<n);cards[i].setAttribute('aria-hidden',i===n?'false':'true');dots.children[i].setAttribute('aria-current',i===n?'true':'false');}cur=n;count.textContent=(n+1)+' / '+cards.length;}
document.getElementById('prev').onclick=function(){go(cur-1)};
document.getElementById('next').onclick=function(){go(cur+1)};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}else if(e.key==='Home'){go(0)}else if(e.key==='End'){go(cards.length-1)}});
var sx=null;document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)go(cur+(dx<0?1:-1));sx=null});
// falling leaves
var L=document.getElementById('leaves');
for(var k=0;k<14;k++){var s=document.createElement('div');s.className='leaf';var sz=18+Math.random()*26;s.style.width=sz+'px';s.style.left=(Math.random()*100)+'vw';s.style.animationDuration=(9+Math.random()*10)+'s';s.style.animationDelay=(-Math.random()*18)+'s';s.innerHTML=(k%2?OVAL:LEAF).replace('FILL',COLS[k%5]);L.appendChild(s);}
go(0);
</script>
</body>
</html>
