  &lt;div class=&quot;choice-wrap&quot;&gt;&lt;div id=&quot;g2&quot; class=&quot; qlabel&quot;&gt;I am working&lt;/div&gt;&lt;div class=&quot;choices sm&quot; role=&quot;group&quot; aria-labelledby=&quot;g2&quot; data-key=&quot;where&quot; data-label=&quot;I am working&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;room&quot; aria-pressed=&quot;false&quot;&gt;In the room&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;online&quot; aria-pressed=&quot;false&quot;&gt;Online&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;span class=&quot;mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/header&gt;&lt;section class=&quot;sec&quot; id=&quot;s1&quot;&gt;&lt;h2&gt;&lt;span class=&quot;n&quot; aria-hidden=&quot;true&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;Habit Check&lt;/span&gt; &lt;span class=&quot;tag&quot;&gt;PAIRS&lt;/span&gt;&lt;/h2&gt;&lt;p class=&quot;inst&quot;&gt;Ask your partner all three questions and one follow-up for each. Write short notes about your partner.&lt;/p&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f3&quot; class=&quot;&quot;&gt;1. What did you use to do that you stopped doing? &lt;span class=&quot;muted&quot;&gt;(Why did you stop?)&lt;/span&gt;&lt;/label&gt;&lt;textarea id=&quot;f3&quot; rows=&quot;2&quot; data-key=&quot;wu1&quot; data-label=&quot;1. What did you use to do that you stopped doing? (Why did you stop?)&quot; placeholder=&quot;My partner...&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f4&quot; class=&quot;&quot;&gt;2. What are you trying to do more of these days? &lt;span class=&quot;muted&quot;&gt;(How is it going?)&lt;/span&gt;&lt;/label&gt;&lt;textarea id=&quot;f4&quot; rows=&quot;2&quot; data-key=&quot;wu2&quot; data-label=&quot;2. What are you trying to do more of these days? (How is it going?)&quot; placeholder=&quot;My partner...&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f5&quot; class=&quot;&quot;&gt;3. What is one thing you can&amp;#x27;t stop doing? &lt;span class=&quot;muted&quot;&gt;(Do you want to stop? Why or why not?)&lt;/span&gt;&lt;/label&gt;&lt;textarea id=&quot;f5&quot; rows=&quot;2&quot; data-key=&quot;wu3&quot; data-label=&quot;3. What is one thing you can&amp;amp;#x27;t stop doing? (Do you want to stop? Why or why not?)&quot; placeholder=&quot;My partner...&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;sec&quot; id=&quot;s2&quot;&gt;&lt;h2&gt;&lt;span class=&quot;n&quot; aria-hidden=&quot;true&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;Change One Thing: Ask Nina&lt;/span&gt; &lt;span class=&quot;tag&quot;&gt;READING&lt;/span&gt;&lt;/h2&gt;&lt;p class=&quot;inst&quot;&gt;Read for meaning first. What is each problem? What does Nina suggest?&lt;/p&gt;&lt;details class=&quot;more readbox&quot; open&gt;&lt;summary&gt;Read: &lt;b&gt;Change One Thing: Ask Nina&lt;/b&gt;&lt;/summary&gt;&lt;div class=&quot;more-body&quot;&gt;&lt;div class=&quot;reading&quot;&gt;&lt;p class=&quot;intro&quot;&gt;Nina writes an advice column about habits. Every week, readers write to her about something they want to start or stop doing.&lt;/p&gt;&lt;div class=&quot;card letter&quot;&gt;&lt;p style=&quot;margin:0 0 8px&quot;&gt;&lt;b class=&quot;navy&quot;&gt;Letter 1.&lt;/b&gt; Dear Nina, I can&amp;#x27;t stop scrolling on my phone at night. I usually go to bed at 11, but I end up watching videos until 2 a.m. I have tried to stop, but I always give in after a night or two. I&amp;#x27;m tired of feeling exhausted at work. How can I change this? &lt;i class=&quot;muted&quot;&gt;Signed, Tired of Being Tired&lt;/i&gt;&lt;/p&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;b class=&quot;navy&quot;&gt;Nina&#x27;s reply.&lt;/b&gt; Dear Tired, you are not alone! Many people have trouble putting their phones down at night. First, stop thinking of this as a willpower problem. Try charging your phone in the kitchen instead of keeping it next to your bed. If you need an alarm, consider buying a cheap alarm clock. It&amp;#x27;s also worth setting a &amp;quot;wind-down&amp;quot; time: at 10:30, put the phone away and do something calm, like reading. At first, it will feel strange. You&amp;#x27;re used to having your phone in your hand, so you will probably keep reaching for it. But after two or three weeks, you will get used to falling asleep without it. And remember to be kind to yourself on bad nights. There&amp;#x27;s no point in feeling guilty. Just try again the next day.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card letter&quot;&gt;&lt;p style=&quot;margin:0 0 8px&quot;&gt;&lt;b class=&quot;navy&quot;&gt;Letter 2.&lt;/b&gt; Dear Nina, I want to start exercising, but I keep putting it off. I used to play soccer when I was younger, but I haven&amp;#x27;t exercised in years. I&amp;#x27;m afraid of looking silly at the gym, and when I do start, I never manage to keep going for more than a week. Help! &lt;i class=&quot;muted&quot;&gt;Signed, Stuck on the Couch&lt;/i&gt;&lt;/p&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;b class=&quot;navy&quot;&gt;Nina&#x27;s reply.&lt;/b&gt; Dear Stuck, starting is always the hardest part. Instead of planning to run five miles, decide to walk for ten minutes after dinner. Small steps are easier to repeat. I&amp;#x27;d also encourage you to find a partner, because it&amp;#x27;s hard to cancel when someone is waiting for you. Avoid comparing yourself to other people at the gym; they are too busy to notice you anyway! I remember feeling the same way when I started swimming. I stopped going after two weeks because I felt embarrassed. Then a friend convinced me to try again, and this time I stopped to celebrate every small win. Now I can&amp;#x27;t imagine not swimming. Don&amp;#x27;t forget to put every walk on your calendar. I&amp;#x27;m looking forward to hearing about your progress!&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h3&gt;Talk with your partner&lt;/h3&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f6&quot; class=&quot;&quot;&gt;1. What is each reader&amp;#x27;s problem?&lt;/label&gt;&lt;textarea id=&quot;f6&quot; rows=&quot;2&quot; data-key=&quot;gist1&quot; data-label=&quot;1. What is each reader&amp;amp;#x27;s problem?&quot; placeholder=&quot;&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f7&quot; class=&quot;&quot;&gt;2. Which piece of Nina&amp;#x27;s advice is the most useful? Why?&lt;/label&gt;&lt;textarea id=&quot;f7&quot; rows=&quot;2&quot; data-key=&quot;gist2&quot; data-label=&quot;2. Which piece of Nina&amp;amp;#x27;s advice is the most useful? Why?&quot; placeholder=&quot;&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f8&quot; class=&quot;&quot;&gt;3. Do you have a habit like Tired&amp;#x27;s or Stuck&amp;#x27;s? What have you tried?&lt;/label&gt;&lt;textarea id=&quot;f8&quot; rows=&quot;2&quot; data-key=&quot;gist3&quot; data-label=&quot;3. Do you have a habit like Tired&amp;amp;#x27;s or Stuck&amp;amp;#x27;s? What have you tried?&quot; placeholder=&quot;&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;sec&quot; id=&quot;s3&quot;&gt;&lt;h2&gt;&lt;span class=&quot;n&quot; aria-hidden=&quot;true&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;Pattern Detectives&lt;/span&gt; &lt;span class=&quot;tag&quot;&gt;DISCOVER&lt;/span&gt;&lt;/h2&gt;&lt;h3&gt;Task A. Find each phrase in the reading. Drag it into the right box.&lt;/h3&gt;&lt;p class=&quot;muted no-print&quot;&gt;On a phone or with a keyboard: tap a phrase, then tap &lt;b&gt;Move here&lt;/b&gt; on a box. Drag a phrase back to the top to undo.&lt;/p&gt;&lt;div class=&quot;dnd&quot; id=&quot;dnd&quot;&gt;&lt;div class=&quot;zone bank&quot; data-zone=&quot;&quot; role=&quot;group&quot; aria-label=&quot;Phrases to sort&quot;&gt;&lt;div class=&quot;zh&quot;&gt;&lt;span&gt;Phrases from the reading&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;put no-print&quot; data-to=&quot;&quot; hidden&gt;Move back here&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;zb&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;chip&quot; id=&quot;chip1&quot; data-i=&quot;1&quot; data-key=&quot;sort1&quot; data-answer=&quot;ing&quot; data-label=&quot;Task A 1: can&amp;#x27;t stop scrolling&quot; aria-pressed=&quot;false&quot;&gt;can&amp;#x27;t stop scrolling&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;chip&quot; id=&quot;chip2&quot; data-i=&quot;2&quot; data-key=&quot;sort2&quot; data-answer=&quot;ing&quot; data-label=&quot;Task A 2: end up watching&quot; aria-pressed=&quot;false&quot;&gt;end up watching&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;chip&quot; id=&quot;chip3&quot; data-i=&quot;3&quot; data-key=&quot;sort3&quot; data-answer=&quot;to&quot; data-label=&quot;Task A 3: have tried to stop&quot; aria-pressed=&quot;false&quot;&gt;have tried to stop&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;chip&quot; id=&quot;chip4&quot; data-i=&quot;4&quot; data-key=&quot;sort4&quot; data-answer=&quot;prep&quot; data-label=&quot;Task A 4: tired of feeling&quot; aria-pressed=&quot;false&quot;&gt;tired of feeling&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;chip&quot; id=&quot;chip5&quot; data-i=&quot;5&quot; data-key=&quot;sort5&quot; data-answer=&quot;ing&quot; data-label=&quot;Task A 5: have trouble putting&quot; aria-pressed=&quot;false&quot;&gt;have trouble putting&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;chip&quot; id=&quot;chip6&quot; data-i=&quot;6&quot; data-key=&quot;sort6&quot; data-answer=&quot;ing&quot; data-label=&quot;Task A 6: consider buying&quot; aria-pressed=&quot;false&quot;&gt;consider buying&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;chip&quot; id=&quot;chip7&quot; data-i=&quot;7&quot; data-key=&quot;sort7&quot; data-answer=&quot;ing&quot; data-label=&quot;Task A 7: stop thinking&quot; aria-pressed=&quot;false&quot;&gt;stop thinking&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;chip&quot; id=&quot;chip8&quot; data-i=&quot;8&quot; data-key=&quot;sort8&quot; data-answer=&quot;ing&quot; data-label=&quot;Task A 8: keep reaching&quot; aria-pressed=&quot;false&quot;&gt;keep reaching&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;chip&quot; id=&quot;chip9&quot; data-i=&quot;9&quot; data-key=&quot;sort9&quot; data-answer=&quot;to&quot; data-label=&quot;Task A 9: want to start&quot; aria-pressed=&quot;false&quot;&gt;want to start&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;chip&quot; id=&quot;chip10&quot; data-i=&quot;10&quot; data-key=&quot;sort10&quot; data-answer=&quot;prep&quot; data-label=&quot;Task A 10: afraid of looking&quot; aria-pressed=&quot;false&quot;&gt;afraid of looking&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;chip&quot; id=&quot;chip11&quot; data-i=&quot;11&quot; data-key=&quot;sort11&quot; data-answer=&quot;to&quot; data-label=&quot;Task A 11: manage to keep&quot; aria-pressed=&quot;false&quot;&gt;manage to keep&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;chip&quot; id=&quot;chip12&quot; data-i=&quot;12&quot; data-key=&quot;sort12&quot; data-answer=&quot;to&quot; data-label=&quot;Task A 12: decide to walk&quot; aria-pressed=&quot;false&quot;&gt;decide to walk&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;chip&quot; id=&quot;chip13&quot; data-i=&quot;13&quot; data-key=&quot;sort13&quot; data-answer=&quot;to&quot; data-label=&quot;Task A 13: easier to repeat&quot; aria-pressed=&quot;false&quot;&gt;easier to repeat&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;chip&quot; id=&quot;chip14&quot; data-i=&quot;14&quot; data-key=&quot;sort14&quot; data-answer=&quot;ing&quot; data-label=&quot;Task A 14: avoid comparing&quot; aria-pressed=&quot;false&quot;&gt;avoid comparing&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;chip&quot; id=&quot;chip15&quot; data-i=&quot;15&quot; data-key=&quot;sort15&quot; data-answer=&quot;prep&quot; data-label=&quot;Task A 15: instead of planning&quot; aria-pressed=&quot;false&quot;&gt;instead of planning&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;chip&quot; id=&quot;chip16&quot; data-i=&quot;16&quot; data-key=&quot;sort16&quot; data-answer=&quot;prep&quot; data-label=&quot;Task A 16: looking forward to hearing&quot; aria-pressed=&quot;false&quot;&gt;looking forward to hearing&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;zones&quot;&gt;&lt;div class=&quot;zone z-navy&quot; data-zone=&quot;ing&quot; role=&quot;group&quot; aria-label=&quot;verb or expression + -ing&quot;&gt;&lt;div class=&quot;zh&quot;&gt;&lt;span&gt;verb or expression + -ing&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;put no-print&quot; data-to=&quot;ing&quot; hidden&gt;Move here&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;zb&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;zone z-gold&quot; data-zone=&quot;to&quot; role=&quot;group&quot; aria-label=&quot;verb or adjective + to + verb&quot;&gt;&lt;div class=&quot;zh&quot;&gt;&lt;span&gt;verb or adjective + to + verb&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;put no-print&quot; data-to=&quot;to&quot; hidden&gt;Move here&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;zb&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;zone z-berry&quot; data-zone=&quot;prep&quot; role=&quot;group&quot; aria-label=&quot;preposition + -ing&quot;&gt;&lt;div class=&quot;zh&quot;&gt;&lt;span&gt;preposition + -ing&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;put no-print&quot; data-to=&quot;prep&quot; hidden&gt;Move here&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;zb&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;dnd-live sr&quot; aria-live=&quot;polite&quot; id=&quot;dndlive&quot;&gt;&lt;/div&gt;&lt;div id=&quot;grp-sort&quot;&gt;&lt;/div&gt;&lt;div class=&quot;checkrow no-print&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn check&quot; data-check=&quot;sort&quot;&gt;Check my answers&lt;/button&gt;&lt;div class=&quot;feedback&quot; id=&quot;fb-sort&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3&gt;Task B. Same verb, different meaning&lt;/h3&gt;&lt;div class=&quot;card&quot;&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b class=&quot;navy&quot;&gt;1.&lt;/b&gt; &lt;b&gt;A&lt;/b&gt; &amp;quot;I stopped going after two weeks.&amp;quot; &amp;nbsp; &lt;b&gt;B&lt;/b&gt; &amp;quot;This time I stopped to celebrate every small win.&amp;quot;&lt;/p&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f9&quot; class=&quot;&quot;&gt;&lt;i&gt;Which sentence means Nina quit? Which means she paused to do something?&lt;/i&gt;&lt;/label&gt;&lt;textarea id=&quot;f9&quot; rows=&quot;2&quot; data-key=&quot;pair1&quot; data-label=&quot;Which sentence means Nina quit? Which means she paused to do something?&quot; placeholder=&quot;&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b class=&quot;navy&quot;&gt;2.&lt;/b&gt; &lt;b&gt;A&lt;/b&gt; &amp;quot;Remember to be kind to yourself.&amp;quot; &amp;nbsp; &lt;b&gt;B&lt;/b&gt; &amp;quot;I remember feeling the same way.&amp;quot;&lt;/p&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f10&quot; class=&quot;&quot;&gt;&lt;i&gt;Which one is a task for the future? Which one is a memory?&lt;/i&gt;&lt;/label&gt;&lt;textarea id=&quot;f10&quot; rows=&quot;2&quot; data-key=&quot;pair2&quot; data-label=&quot;Which one is a task for the future? Which one is a memory?&quot; placeholder=&quot;&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b class=&quot;navy&quot;&gt;3.&lt;/b&gt; &lt;b&gt;A&lt;/b&gt; &amp;quot;I have tried to stop, but I always give in.&amp;quot; &amp;nbsp; &lt;b&gt;B&lt;/b&gt; &amp;quot;Try charging your phone in the kitchen.&amp;quot;&lt;/p&gt;&lt;div class=&quot;field &quot;&gt;&lt;label for=&quot;f11&quot; class=&quot;&quot;&gt;&lt;i&gt;Which one is an effort that did not work? Which one is a suggestion to experiment?&lt;/i&gt;&lt;/label&gt;&lt;textarea id=&quot;f11&quot; rows=&quot;2&quot; data-key=&quot;pair3&quot; data-label=&quot;Which one is an effort that did not work? Which one is a suggestion to experiment?&quot; placeholder=&quot;&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;details class=&quot;more &quot;&gt;&lt;summary&gt;Answers (open after you talk)&lt;/summary&gt;&lt;div class=&quot;more-body&quot;&gt;&lt;ol&gt;&lt;li&gt;Stopped going = she quit. Stopped to celebrate = she paused in order to celebrate.&lt;/li&gt;&lt;li&gt;Remember to be kind = a task (don&amp;#x27;t forget). Remember feeling = a memory from the past.&lt;/li&gt;&lt;li&gt;Tried to stop = an effort that did not work. Try charging = a suggestion: experiment with this.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/details&gt;&lt;h3&gt;Task C. Used to, be used to, get used to: what does it mean?&lt;/h3&gt;&lt;div id=&quot;grp-used&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;qlabel&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt; &amp;quot;I used to play soccer.&amp;quot;&lt;/div&gt;&lt;div class=&quot;choice-wrap&quot;&gt;&lt;div id=&quot;g12&quot; class=&quot;sr qlabel&quot;&gt;Task C 1: &quot;I used to play soccer.&quot;&lt;/div&gt;&lt;div class=&quot;choices sm&quot; role=&quot;group&quot; aria-labelledby=&quot;g12&quot; data-key=&quot;used1&quot; data-label=&quot;Task C 1: &amp;quot;I used to play soccer.&amp;quot;&quot; data-answer=&quot;a&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;a&quot; aria-pressed=&quot;false&quot;&gt;a past habit&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;b&quot; aria-pressed=&quot;false&quot;&gt;it feels normal now&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;c&quot; aria-pressed=&quot;false&quot;&gt;a change (becoming normal)&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;span class=&quot;mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;qlabel&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt; &amp;quot;You&amp;#x27;re used to having your phone in your hand.&amp;quot;&lt;/div&gt;&lt;div class=&quot;choice-wrap&quot;&gt;&lt;div id=&quot;g13&quot; class=&quot;sr qlabel&quot;&gt;Task C 2: &quot;You&#x27;re used to having your phone in your hand.&quot;&lt;/div&gt;&lt;div class=&quot;choices sm&quot; role=&quot;group&quot; aria-labelledby=&quot;g13&quot; data-key=&quot;used2&quot; data-label=&quot;Task C 2: &amp;quot;You&amp;#x27;re used to having your phone in your hand.&amp;quot;&quot; data-answer=&quot;b&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;a&quot; aria-pressed=&quot;false&quot;&gt;a past habit&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;b&quot; aria-pressed=&quot;false&quot;&gt;it feels normal now&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot; data-val=&quot;c&quot; aria-pressed=&quot;false&quot;&gt;a change (becoming normal)&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;pv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;span class=&quot;mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;qlabel&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt; &amp;quot;You will get used to falling asleep without it.&amp;quot;&lt;/div&gt;&lt;div class=&quot;choice-wrap&quot;&gt;&lt;div &lt;div class=&quot;top&quot;&gt;&lt;div&gt;&lt;div class=&quot;org&quot;&gt;APPROACH INTERNATIONAL STUDENT CENTER&lt;/div&gt;&lt;h1&gt;Gerunds and Infinitives&lt;/h1&gt;&lt;p class=&quot;sub&quot;&gt;Week 5 Reference Card · Change One Thing&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;big&quot;&gt;-ing or to? Look at the word that comes BEFORE the verb.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2 style=&quot;margin:0&quot;&gt;1. Gerunds after prepositions&lt;/h2&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:2px 0&quot;&gt;&lt;i&gt;When a verb comes right after a preposition, it takes the -ing form.&lt;/i&gt;&lt;/p&gt;&lt;p class=&quot;ice&quot; style=&quot;margin:6px 0&quot;&gt;&lt;b&gt;Is &quot;to&quot; a preposition?&lt;/b&gt; Test: can you put a noun after it? &lt;i&gt;look forward to the weekend&lt;/i&gt;, so: &lt;i&gt;look forward to seeing you&lt;/i&gt;.&lt;/p&gt;&lt;ul style=&quot;margin:6px 0 0;padding-left:20px&quot;&gt;&lt;li&gt;She was afraid of making mistakes.&lt;/li&gt;&lt;li&gt;I&amp;#x27;m looking forward to seeing you tomorrow.&lt;/li&gt;&lt;li&gt;He left without saying goodbye.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2 style=&quot;margin:0&quot;&gt;2. Verb + gerund&lt;/h2&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:2px 0&quot;&gt;&lt;i&gt;Some verbs are always followed by a gerund when another action comes next.&lt;/i&gt;&lt;/p&gt;&lt;p class=&quot;ice&quot; style=&quot;margin:6px 0&quot;&gt;&lt;b&gt;Common verbs:&lt;/b&gt; avoid, enjoy, consider, finish, keep, mind, suggest, quit, practice, imagine, end up&lt;/p&gt;&lt;ul style=&quot;margin:6px 0 0;padding-left:20px&quot;&gt;&lt;li&gt;She kept showing up every Saturday.&lt;/li&gt;&lt;li&gt;Do you mind staying longer?&lt;/li&gt;&lt;li&gt;I need to practice speaking English.&lt;/li&gt;&lt;li&gt;He finally finished writing the report.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2 style=&quot;margin:0&quot;&gt;3. Verb + infinitive&lt;/h2&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:2px 0&quot;&gt;&lt;i&gt;Other verbs are always followed by an infinitive when another action comes next.&lt;/i&gt;&lt;/p&gt;&lt;p class=&quot;ice&quot; style=&quot;margin:6px 0&quot;&gt;&lt;b&gt;Common verbs:&lt;/b&gt; decide, plan, hope, want, need, agree, promise, refuse, manage&lt;/p&gt;&lt;ul style=&quot;margin:6px 0 0;padding-left:20px&quot;&gt;&lt;li&gt;She decided to change her routine.&lt;/li&gt;&lt;li&gt;He promised to call as soon as he landed.&lt;/li&gt;&lt;li&gt;They refused to leave without an answer.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2 style=&quot;margin:0&quot;&gt;4. Adjective + infinitive&lt;/h2&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:2px 0&quot;&gt;&lt;i&gt;After many adjectives that describe feelings or judgments, use the infinitive.&lt;/i&gt;&lt;/p&gt;&lt;p class=&quot;ice&quot; style=&quot;margin:6px 0&quot;&gt;&lt;b&gt;Common adjectives:&lt;/b&gt; important, easy, difficult, hard, ready, happy, surprised, proud&lt;/p&gt;&lt;ul style=&quot;margin:6px 0 0;padding-left:20px&quot;&gt;&lt;li&gt;It is not always easy to make friends in a new city.&lt;/li&gt;&lt;li&gt;She was proud to be on the team.&lt;/li&gt;&lt;li&gt;He felt ready to start his new job.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2 style=&quot;margin:0&quot;&gt;5. Verb + person + infinitive&lt;/h2&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:2px 0&quot;&gt;&lt;i&gt;These verbs often take a person + to + verb. They are very useful for advice.&lt;/i&gt;&lt;/p&gt;&lt;p class=&quot;ice&quot; style=&quot;margin:6px 0&quot;&gt;&lt;b&gt;Common verbs:&lt;/b&gt; advise, encourage, remind, tell, ask, convince, want&lt;/p&gt;&lt;ul style=&quot;margin:6px 0 0;padding-left:20px&quot;&gt;&lt;li&gt;I&amp;#x27;d encourage you to find a partner.&lt;/li&gt;&lt;li&gt;My friend convinced me to try again.&lt;/li&gt;&lt;li&gt;Remind me to call the dentist.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2 style=&quot;margin-top:0&quot;&gt;6. Same verb, different meaning&lt;/h2&gt;&lt;table class=&quot;st &quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Verb&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;+ -ing&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;+ to + verb&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td data-l=&quot;Verb&quot;&gt;&lt;b class=&quot;berry&quot;&gt;stop&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;+ -ing&quot;&gt;stop + gerund = end an activity or habit: She stopped smoking.&lt;/td&gt;&lt;td data-l=&quot;+ to + verb&quot;&gt;stop + infinitive = pause to do something else: She stopped to check her phone.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Verb&quot;&gt;&lt;b class=&quot;berry&quot;&gt;remember&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;+ -ing&quot;&gt;remember + gerund = recall a memory: I remember meeting him.&lt;/td&gt;&lt;td data-l=&quot;+ to + verb&quot;&gt;remember + infinitive = don&amp;#x27;t forget a task: Remember to lock the door.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Verb&quot;&gt;&lt;b class=&quot;berry&quot;&gt;try&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;+ -ing&quot;&gt;try + gerund = experiment with an option: Try adding more salt.&lt;/td&gt;&lt;td data-l=&quot;+ to + verb&quot;&gt;try + infinitive = make an effort (often it doesn&amp;#x27;t work): She tried to open the jar.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Verb&quot;&gt;&lt;b class=&quot;berry&quot;&gt;forget&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;+ -ing&quot;&gt;forget + gerund = (never) forget a memory: I&amp;#x27;ll never forget seeing the ocean.&lt;/td&gt;&lt;td data-l=&quot;+ to + verb&quot;&gt;forget + infinitive = not do a task: I forgot to lock the door.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2 style=&quot;margin-top:0&quot;&gt;7. Used to, be used to, get used to&lt;/h2&gt;&lt;table class=&quot;st &quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Form&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Meaning&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Example&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td data-l=&quot;Form&quot;&gt;&lt;b class=&quot;navy&quot;&gt;used to + verb&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Meaning&quot;&gt;a past habit, not true now&lt;/td&gt;&lt;td data-l=&quot;Example&quot;&gt;I used to play soccer.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Form&quot;&gt;&lt;b class=&quot;navy&quot;&gt;be used to + -ing&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Meaning&quot;&gt;it feels normal now&lt;/td&gt;&lt;td data-l=&quot;Example&quot;&gt;I&amp;#x27;m used to waking up early.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;Form&quot;&gt;&lt;b class=&quot;navy&quot;&gt;get used to + -ing&lt;/b&gt;&lt;/td&gt;&lt;td data-l=&quot;Meaning&quot;&gt;it is becoming normal (a change)&lt;/td&gt;&lt;td data-l=&quot;Example&quot;&gt;I&amp;#x27;m getting used to driving here.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p class=&quot;ice&quot; style=&quot;margin:8px 0 0&quot;&gt;Only &lt;b&gt;used to + verb&lt;/b&gt; is about the past. In &lt;b&gt;be used to&lt;/b&gt; and &lt;b&gt;get used to&lt;/b&gt;, &quot;to&quot; is a preposition: use -ing or a noun (I&#x27;m used to the cold).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2 style=&quot;margin-top:0&quot;&gt;8. Sound advanced: expressions + -ing&lt;/h2&gt;&lt;div class=&quot;two&quot;&gt;&lt;p class=&quot;ice&quot; style=&quot;margin:0&quot;&gt;&lt;b class=&quot;navy&quot;&gt;It&amp;#x27;s worth + -ing&lt;/b&gt;&lt;br&gt;&lt;i&gt;It&amp;#x27;s worth setting a wind-down time.&lt;/i&gt;&lt;/p&gt;&lt;p class=&quot;ice&quot; style=&quot;margin:0&quot;&gt;&lt;b class=&quot;navy&quot;&gt;There&amp;#x27;s no point (in) + -ing&lt;/b&gt;&lt;br&gt;&lt;i&gt;There&amp;#x27;s no point in feeling guilty.&lt;/i&gt;&lt;/p&gt;&lt;p class=&quot;ice&quot; style=&quot;margin:0&quot;&gt;&lt;b class=&quot;navy&quot;&gt;can&amp;#x27;t help + -ing&lt;/b&gt;&lt;br&gt;&lt;i&gt;I can&amp;#x27;t help checking my phone.&lt;/i&gt;&lt;/p&gt;&lt;p class=&quot;ice&quot; style=&quot;margin:0&quot;&gt;&lt;b class=&quot;navy&quot;&gt;have trouble + -ing&lt;/b&gt;&lt;br&gt;&lt;i&gt;I have trouble waking up.&lt;/i&gt;&lt;/p&gt;&lt;p class=&quot;ice&quot; style=&quot;margin:0&quot;&gt;&lt;b class=&quot;navy&quot;&gt;spend time + -ing&lt;/b&gt;&lt;br&gt;&lt;i&gt;I spend too much time scrolling.&lt;/i&gt;&lt;/p&gt;&lt;p class=&quot;ice&quot; style=&quot;margin:0&quot;&gt;&lt;b class=&quot;navy&quot;&gt;look forward to + -ing&lt;/b&gt;&lt;br&gt;&lt;i&gt;I look forward to hearing from you.&lt;/i&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2 style=&quot;margin-top:0&quot;&gt;Giving advice&lt;/h2&gt;&lt;p style=&quot;margin:0&quot;&gt;Try ___ing... &amp;nbsp;·&amp;nbsp; Consider ___ing... &amp;nbsp;·&amp;nbsp; Avoid ___ing... &amp;nbsp;·&amp;nbsp; Instead of ___ing, ... &amp;nbsp;·&amp;nbsp; It&amp;#x27;s worth ___ing... &amp;nbsp;·&amp;nbsp; There&amp;#x27;s no point ___ing... &amp;nbsp;·&amp;nbsp; Remember to ___... &amp;nbsp;·&amp;nbsp; Don&amp;#x27;t forget to ___... &amp;nbsp;·&amp;nbsp; I&amp;#x27;d encourage you to ___... &amp;nbsp;·&amp;nbsp; You&amp;#x27;ll get used to ___ing...&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2 style=&quot;margin-top:0&quot;&gt;Top mistakes&lt;/h2&gt;&lt;table class=&quot;st &quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;✗ Don&#x27;t say&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;✓ Say&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td data-l=&quot;✗ Don&amp;#x27;t say&quot;&gt;&lt;span class=&quot;bad&quot;&gt;I&amp;#x27;m looking forward to see you.&lt;/span&gt;&lt;/td&gt;&lt;td data-l=&quot;✓ Say&quot;&gt;I&amp;#x27;m looking forward to seeing you.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;✗ Don&amp;#x27;t say&quot;&gt;&lt;span class=&quot;bad&quot;&gt;She avoided to talk about it.&lt;/span&gt;&lt;/td&gt;&lt;td data-l=&quot;✓ Say&quot;&gt;She avoided talking about it.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;✗ Don&amp;#x27;t say&quot;&gt;&lt;span class=&quot;bad&quot;&gt;He decided changing jobs.&lt;/span&gt;&lt;/td&gt;&lt;td data-l=&quot;✓ Say&quot;&gt;He decided to change jobs.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;✗ Don&amp;#x27;t say&quot;&gt;&lt;span class=&quot;bad&quot;&gt;I&amp;#x27;m not used to wake up early.&lt;/span&gt;&lt;/td&gt;&lt;td data-l=&quot;✓ Say&quot;&gt;I&amp;#x27;m not used to waking up early.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;✗ Don&amp;#x27;t say&quot;&gt;&lt;span class=&quot;bad&quot;&gt;It&amp;#x27;s worth to try again.&lt;/span&gt;&lt;/td&gt;&lt;td data-l=&quot;✓ Say&quot;&gt;It&amp;#x27;s worth trying again.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td data-l=&quot;✗ Don&amp;#x27;t say&quot;&gt;&lt;span class=&quot;bad&quot;&gt;They encouraged me apply.&lt;/span&gt;&lt;/td&gt;&lt;td data-l=&quot;✓ Say&quot;&gt;They encouraged me to apply.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

<script>
(function(){
var KEY='approach-isc:grammar-in-context:week5:tab:v1';
var tabs=[].slice.call(document.querySelectorAll('[role=tab]'));
var names=tabs.map(function(t){return t.dataset.tab;});
function show(name,focus){
 if(names.indexOf(name)<0)name=names[0];
 tabs.forEach(function(t){var on=t.dataset.tab===name;t.setAttribute('aria-selected',on?'true':'false');t.tabIndex=on?0:-1;
  var p=document.getElementById('panel-'+t.dataset.tab);p.hidden=!on;
  if(on){var f=p.querySelector('iframe');if(f.dataset.srcdoc){f.srcdoc=f.dataset.srcdoc;f.removeAttribute('data-srcdoc');}if(focus)t.focus();}});
 try{localStorage.setItem(KEY,name);}catch(e){}

 document.title=document.getElementById('tab-'+name).textContent.replace(/^\d/,'')+' · Week 5 · Grammar in Context';
}
tabs.forEach(function(t,i){

 t.addEventListener('keydown',function(e){var j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;else if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=tabs.length-1;
  if(j!==null){e.preventDefault();show(tabs[j].dataset.tab,true);}});

});

var start=location.hash.slice(1);if(names.indexOf(start)<0){try{start=localStorage.getItem(KEY)||'';}catch(e){start='';}}

</script>
