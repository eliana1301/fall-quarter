<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Stress Listening</title>
<style>
:root{--bg:#f7f5f1;--card:#fff;--ink:#1f2328;--muted:#6b7280;--accent:#2563eb;--accent-bg:#eaf1ff;--line:#e5e1da}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--card:#1f2228;--ink:#ececec;--muted:#9aa0a8;--accent:#7aa7ff;--accent-bg:#1d2a44;--line:#2e3239}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:32px 16px 48px}
h1{font-size:1.6rem;margin:0 0 6px}
p{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.w{display:flex;align-items:center;gap:10px;padding:16px;font:600 1.1rem system-ui,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s,transform .1s}
.w svg{width:22px;height:22px;flex:none;fill:var(--accent)}
.w:hover{border-color:var(--accent)}
.w:active{transform:scale(.97)}
.w.playing{background:var(--accent-bg);border-color:var(--accent)}
.w:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr}.w{font-size:1rem;padding:14px 12px}}
</style></head><body><main>
<h1>Word Stress: Listen and Find the Stress</h1>
<p>Click a word to hear it. Listen carefully and decide which syllable is stressed. You can play each word as many times as you need.</p>
